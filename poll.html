<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>evening · nov 9</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&display=swap">
  <!--
    poll.html: the page the buttons in the nov 9 email open.
    ?g=<guest id>&pick=<yes|refund|other>. nothing is saved until the guest presses
    confirm (email scanners open every link). talks to the "evening date poll" apps script
    the same way app.js talks to Code.gs. the menu on the left is read from MENUS in app.js.
  -->
  <style>
    :root {
      --paper: #F2EBDD; --paper-bright: #F8F3E9; --ink: #1B1A17;
      --tomato: #D93A1E; --tomato-ink: #B52D13;
      --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
      --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --text-body: clamp(18px, 0.9vw + 13.5px, 21px);
      --shadow-print: 3px 3px 0 var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: var(--text-body)/1.5 var(--font-serif); }
    .wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); min-height: 100vh; }
    /* the menu stays in view while the form scrolls */
    .card { background: var(--paper-bright); border-right: 1.5px solid var(--ink); padding: 40px clamp(20px, 4vw, 48px); position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; }
    .act { padding: 40px clamp(20px, 4vw, 48px); align-self: center; max-width: 30rem; }
    .meta, .kicker, .label { font: 500 12.5px/1.4 var(--font-mono); letter-spacing: .04em; margin: 0 0 8px; }
    .kicker { color: var(--tomato-ink); margin-top: 20px; }
    h1 { font-style: italic; font-weight: 500; font-size: clamp(40px, 5vw, 60px); line-height: 1; margin: 0 0 10px; text-shadow: 2px 2px 0 var(--tomato); }
    .dek { font-style: italic; margin: 0 0 20px; }
    .intro p { margin: 0 0 14px; }
    .items { list-style: none; padding: 0; margin: 24px 0 0; border-top: 1.5px solid var(--ink); }
    .items li { padding: 12px 0; border-bottom: 1px dashed rgba(27, 26, 23, .35); }
    .items p { margin: 2px 0 0; }
    .nm { font-weight: 600; } .alt { font-style: italic; font-weight: 400; } .sub { font-style: italic; }
    .tbd { font-family: var(--font-mono); letter-spacing: .2em; }
    .hi { font-style: italic; font-size: 1.3em; margin: 0 0 12px; }
    .paid { margin: 0 0 16px; }
    .field { display: block; margin: 0 0 18px; }
    .field[hidden] { display: none; }
    .link { display: block; margin: 18px 0 0; padding: 0; font: 500 12.5px/1.4 var(--font-mono); color: var(--tomato-ink); background: none; border: 0; text-decoration: underline; cursor: pointer; }
    input, select, textarea { display: block; width: 100%; margin-top: 4px; padding: 10px; font: 17px/1.4 var(--font-serif); color: var(--ink); background: var(--paper-bright); border: 1.5px solid var(--ink); border-radius: 0; }
    a.btn { display: inline-block; text-decoration: none; margin-top: 14px; }
    .pay { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin: 0 0 20px; }
    .pay a.btn { margin-top: 0; }
    .btn.btn--ghost { color: var(--ink); background: transparent; box-shadow: none; }
    .btn.btn--ghost:hover { background: var(--paper-bright); box-shadow: none; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
    .choice { font: 600 13px/1.25 var(--font-mono); letter-spacing: .02em; padding: 12px 14px; min-height: 44px; text-align: left; color: var(--ink); background: var(--paper-bright); border: 1.5px solid var(--ink); cursor: pointer; }
    .choice[aria-pressed="true"] { color: var(--paper-bright); background: var(--ink); box-shadow: 3px 3px 0 var(--tomato); }
    .section[hidden] { display: none; }
    fieldset.radios { border: 0; padding: 0; min-width: 0; }
    .radios legend { padding: 0; }
    .radio { display: flex; align-items: center; gap: 10px; min-height: 36px; cursor: pointer; }
    .radio input { display: inline-block; width: 18px; height: 18px; margin: 0; accent-color: var(--tomato-ink); }
    .spectrum { margin: 0 0 20px; }
    .spectrum__bar { height: 10px; border: 1.5px solid var(--ink); background: linear-gradient(90deg, var(--paper-bright), var(--tomato)); }
    .spectrum__stops { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 6px; }
    .spectrum__stop { display: flex; flex-direction: column; gap: 2px; }
    .spectrum__stop:nth-child(2) { align-items: center; text-align: center; }
    .spectrum__stop:nth-child(3) { align-items: flex-end; text-align: right; }
    .spectrum__amt { font: 600 18px/1.1 var(--font-serif); }
    .spectrum__lbl { font: 500 11.5px/1.3 var(--font-mono); }
    .qr { width: 180px; height: 180px; border: 1.5px solid var(--ink); background: #fff; }
    .btn { font: 600 14px/1 var(--font-mono); letter-spacing: .03em; padding: 14px 18px; min-height: 44px; color: #fff; background: var(--tomato-ink); border: 1.5px solid var(--ink); box-shadow: var(--shadow-print); cursor: pointer; }
    .btn:hover { box-shadow: 4px 4px 0 var(--ink); } .btn:active { box-shadow: 1px 1px 0 var(--ink); }
    .btn:disabled { opacity: .7; cursor: default; }
    .status { font: 500 12.5px/1.4 var(--font-mono); margin: 14px 0 0; }
    :focus-visible { outline: 3px solid #2B59C3; outline-offset: 2px; }
    @media (max-width: 760px) {
      .wrap { grid-template-columns: 1fr; }
      .act { order: -1; padding: 32px 20px; }
      .card { position: static; height: auto; border-right: 0; border-top: 1.5px solid var(--ink); padding: 32px 20px; }
      .qr { display: none; } /* you can't scan your own phone screen */
    }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="card" aria-label="the menu">
      <p class="meta" id="meta"></p>
      <p class="kicker">a possible menu</p>
      <h1 id="theme"></h1>
      <p class="dek" id="dek" hidden></p>
      <div class="intro" id="intro"></div>
      <ol class="items" id="items"><li>loading the menu…</li></ol>
    </aside>
    <main class="act" id="act" aria-live="polite"><p class="status">loading… this can take a few seconds.</p></main>
  </div>
  <script>
    const API = "https://script.google.com/macros/s/AKfycbwY2wDIM0FAAumUJ27UqS_CVa4siz9RnTlRZ0zWuSwcq8Rin4gafXVr1QvjbuZstAc/exec";
    const q = new URLSearchParams(location.search);
    const g = (q.get("g") || "").replace(/[^a-z0-9]/gi, "");
    const pick = q.get("pick") || "";
    const $ = (id) => document.getElementById(id);
    const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };

    // a text/plain POST, like app.js, so the browser skips the CORS preflight apps script can't answer
    async function call(action, payload) {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, ...payload }),
        redirect: "follow"
      });
      if (!res.ok) throw new Error(`http ${res.status}`);
      return res.json();
    }
    function say(text) { const a = $("act"); a.innerHTML = ""; a.append(el("p", "hi", text)); }

    // the same menu the site's card shows: MENUS in app.js, by session id, then by its old date key
    async function showMenu(sessionId, oldKey) {
      const list = $("items");
      try {
        const src = await (await fetch("app.js", { cache: "no-store" })).text();
        const a = src.indexOf("const MENUS = {"), b = src.indexOf("\n};", a);
        const all = new Function(`return ${src.slice(a + 14, b + 2)}`)();
        const m = all[sessionId] || all[oldKey];
        list.innerHTML = "";
        if (!m) { list.append(el("li", null, "menu still being written")); return; }
        if (m.dek) { $("dek").textContent = m.dek; $("dek").hidden = false; }
        (m.intro || []).forEach((p) => $("intro").append(el("p", null, p)));
        (m.items || []).forEach((it) => {
          const li = el("li");
          if (it.kind === "tbd") li.append(el("span", "tbd", "??"));
          else if (it.kind === "drink") { const p = el("p", "nm", it.name); p.append(el("span", "alt", ` // ${it.desc || ""}`)); li.append(p); }
          else {
            const p = el("p", "nm", it.name);
            if (it.alt) p.append(el("span", "alt", ` / ${it.alt}`));
            li.append(p);
            if (it.sub) li.append(el("p", "sub", it.sub));
            (it.lines || []).forEach((l) => li.append(el("p", null, l)));
          }
          list.append(li);
        });
      } catch {
        list.innerHTML = "";
        list.append(el("li", null, "the menu didn’t load. it’s on tiglao.github.io/evening."));
      }
    }

    // the answer buttons come first, with the one clicked in the email already pressed.
    // yes opens the rest: for a guest who paid, which night their money goes toward; for a
    // guest who didn't, the ask, what they're sending and how (0 is fine). either can name
    // someone they hope to bring. something else opens a note; refund just confirms.
    // prev holds the last answer, so "change my answer" reopens the form as they left it.
    function showForm(info, prev = {}) {
      const a = $("act"); a.innerHTML = "";
      a.append(el("p", "hi", `hi ${info.name},`));
      const paid = info.paid > 0;
      if (paid) a.append(el("p", "paid", `you paid $${info.paid}.`));
      let current = info.choices.some((c) => c.key === (prev.pick || pick)) ? (prev.pick || pick) : info.choices[0].key;

      const row = el("div", "choices");
      row.setAttribute("role", "group"); row.setAttribute("aria-label", "your answer");
      const choiceBtns = info.choices.map((c) => {
        const b = el("button", "choice", c.label); b.type = "button";
        b.addEventListener("click", () => { current = c.key; update(); });
        row.append(b); return { b, c };
      });
      a.append(row);

      const field = (parent, label, input) => { const lab = el("label", "field"); lab.append(el("span", "label", label), input); parent.append(lab); return lab; };
      const yes = el("div", "section"), other = el("div", "section");
      a.append(yes, other);

      let sel = null, amount = null, radios = [];
      if (paid) {
        sel = el("select");
        info.options.filter((o) => o.id !== "refund" && o.id !== "other").forEach((o) => {
          const op = el("option", null, o.label); op.value = o.id; op.selected = o.id === (prev.apply || info.sessionId); sel.append(op);
        });
        field(yes, `put your $${info.paid} toward`, sel);
        sel.addEventListener("change", () => update());
      } else {
        yes.append(el("p", "paid", "to hold your seat, venmo what you can to @archipelaga with “nov 9” and your name in the note."));
        const qr = el("img", "qr"); qr.src = "venmo-qr.png"; qr.alt = "venmo qr code for @archipelaga"; qr.width = 180; qr.height = 180;
        const open = el("a", "btn btn--ghost", "open venmo @archipelaga");
        open.href = "https://venmo.com/u/archipelaga"; open.target = "_blank"; open.rel = "noopener";
        const pay = el("div", "pay"); pay.append(qr, open); yes.append(pay);
        // the night's ask, from the sheet, drawn as a range to read; nothing here fills the box
        if (info.asks && info.asks.length) {
          yes.append(el("p", "label", "the ask for this night"));
          const spec = el("figure", "spectrum");
          spec.setAttribute("role", "img");
          spec.setAttribute("aria-label", `the ask for this night: ${info.asks.map((t) => `$${t.amount} ${t.label}`).join(", ")}`);
          const stops = el("div", "spectrum__stops");
          info.asks.forEach((t) => {
            const s = el("div", "spectrum__stop"); s.setAttribute("aria-hidden", "true");
            s.append(el("span", "spectrum__amt", `$${t.amount}`), el("span", "spectrum__lbl", t.label));
            stops.append(s);
          });
          const bar = el("div", "spectrum__bar"); bar.setAttribute("aria-hidden", "true");
          spec.append(bar, stops); yes.append(spec);
        }
        amount = el("input"); amount.type = "number"; amount.min = "0"; amount.step = "1"; amount.inputMode = "decimal";
        amount.value = prev.amount ?? "";
        field(yes, "how much are you sending? ($, 0 is fine)", amount);
        const how = el("fieldset", "field radios");
        how.append(el("legend", "label", "how?"));
        radios = info.methods.map((m, i) => {
          const r = el("input"); r.type = "radio"; r.name = "method"; r.value = m.key;
          r.checked = prev.method ? m.key === prev.method : i === 0;
          const lab = el("label", "radio"); lab.append(r, el("span", null, m.label)); how.append(lab);
          return r;
        });
        yes.append(how);
      }
      const bring = el("input"); bring.type = "text"; bring.maxLength = 200; bring.value = prev.bringing || "";
      bring.placeholder = "their name";
      field(yes, "hoping to bring someone? (optional)", bring);
      const note = el("textarea"); note.rows = 5; note.value = prev.note || "";
      field(other, "your note", note);

      const btn = el("button", "btn"); btn.type = "button";
      const status = el("p", "status");
      a.append(btn, status);

      function update() {
        choiceBtns.forEach(({ b, c }) => b.setAttribute("aria-pressed", String(c.key === current)));
        yes.hidden = current !== "yes";
        other.hidden = current !== "other";
        status.textContent = "";
        if (current === "other") btn.textContent = "send";
        else if (current === "refund") btn.textContent = `confirm: refund my $${info.paid}`;
        else if (paid) btn.textContent = `confirm: put $${info.paid} toward ${sel.options[sel.selectedIndex].text}`;
        else btn.textContent = "confirm: yes, i’ll be there nov 9";
      }
      update();

      btn.addEventListener("click", async () => {
        if (current === "other" && !note.value.trim()) { note.focus(); status.textContent = "write a note first."; return; }
        if (current === "yes" && amount && (amount.value === "" || Number(amount.value) < 0)) { amount.focus(); status.textContent = "add the amount you’re sending (0 is fine)."; return; }
        const checked = radios.find((r) => r.checked);
        const answer = {
          pick: current,
          apply: !paid ? "" : current === "yes" ? sel.value : current,
          note: current === "other" ? note.value : "",
          amount: !paid && current === "yes" ? amount.value : "",
          method: !paid && current === "yes" && checked ? checked.value : "",
          bringing: current === "yes" ? bring.value : ""
        };
        btn.disabled = true; btn.textContent = "saving…"; status.textContent = "";
        try {
          const r = await call("record", { g, ...answer });
          say(r.message);
          if (r.venmo) {
            const v = el("a", "btn btn--ghost", "open venmo @archipelaga");
            v.href = "https://venmo.com/u/archipelaga"; v.target = "_blank"; v.rel = "noopener";
            $("act").append(v);
          }
          const again = el("button", "link", "change my answer"); again.type = "button";
          again.addEventListener("click", () => showForm(info, answer));
          $("act").append(again);
        } catch {
          btn.disabled = false; update();
          status.textContent = "that didn’t save. try again, or reply to the email.";
        }
      });
    }

    (async () => {
      if (!g || !pick) { say("that link looks incomplete. reply to the email and tell me what works."); return; }
      let info;
      try { info = await call("info", { g, pick }); }
      catch { say("something went wrong loading this. reply to the email and tell me what works."); return; }
      if (info.card) { $("meta").textContent = info.card.meta; $("theme").textContent = info.card.theme; }
      showMenu(info.sessionId, info.oldMenuKey);
      if (info.status === "ok") showForm(info); else say(info.message);
    })();
  </script>
</body>
</html>
